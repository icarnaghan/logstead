[tool.poetry]
name = "logstead-backend"
version = "0.1.0"
description = "Logstead FastAPI backend"
authors = ["Your Name <you@example.com>"]

# Add packages section for Poetry
packages = [
	{ include = "services" },
	{ include = "main.py" }
]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}


[tool.poetry.dev-dependencies]
flake8 = "^7.0.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
