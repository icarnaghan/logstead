[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logstead"
version = "0.1.0"
description = "Logstead backend: a single monolithic Python 3.12 Lambda for Schedule E rental tax preparation."
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pdfplumber",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "moto",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Discover tests in the source tree (co-located `*.test`-style) and a top-level
# tests/ directory. Source lives under src/ so it is importable in tests.
testpaths = ["tests", "src"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.hypothesis]
# Hypothesis reads profiles registered in code; this section documents intent.
# The default profile (see tests/conftest.py) runs a minimum of 100 examples.
