[tool.poetry]
name = "logstead-backend"
version = "0.1.0"
description = "Logstead FastAPI backend"
authors = ["Your Name <you@example.com>"]

# Add packages section for Poetry
packages = [
	{ include = "services" },
	{ include = "main.py" }
]

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
greenlet = "^3.2.4"
sqlalchemy = "^2.0.43"
asyncpg = "^0.30.0"
alembic = "^1.16.4"


[tool.poetry.dev-dependencies]
flake8 = "*"
pytest = "*"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
