# Monorepo-friendly, parallel, with caching & dynamic child pipeline
# Stages: prepare -> sbom -> lint -> test -> scan

stages:
  - prepare
  - sbom
  - lint
  - test
  - scan

# Keep your SAST include
include:
  - template: Security/SAST.gitlab-ci.yml

# Global defaults / small QoL
default:
  interruptible: true
  before_script:
    - echo "[ci] PWD: $PWD"
    - echo "[ci] Root contents:" && ls -al
  cache:
    key:
      files:
        - "**/poetry.lock"
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
    paths:
      - .cache/pip
      - .cache/pypoetry
      - .npm
      - .pnpm-store
      - .yarn/cache
    policy: pull-push

# --------------------------------------------------------------------
# 1) PREP: Generate a child pipeline describing all jobs per directory
#    Any dir with pyproject.toml -> Python jobs
#    Any dir with package.json   -> Node jobs
# --------------------------------------------------------------------
generate-child-pipeline:
  stage: prepare
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH    # run on branches, too
  script:
    - apk add --no-cache bash
    - |
      echo "Generating child pipeline..."
      cat > child-pipeline.yml <<'YAML'
      # Autogenerated by generate-child-pipeline
      stages: [sbom, lint, test, scan]

      # ---------- Helpers ----------
      .py_base:
        image: python:3.11
        variables:
          PIP_CACHE_DIR: .cache/pip
          POETRY_CACHE_DIR: .cache/pypoetry
        before_script:
          - python --version
          - pip install --upgrade pip
          - pip install poetry
          - echo "[py] using poetry $(poetry --version)"

      .node_base:
        image: node:20-alpine
        before_script:
          - node --version
          - npm --version
          - npm config set cache .npm --location=project

      # ---------- Templates ----------
      .py_sbom:
        extends: .py_base
        stage: sbom
        script:
          - cd "$DIR"
          - pip install cyclonedx-bom
          - cyclonedx-py -o sbom.xml
        artifacts:
          when: always
          paths:
            - ${DIR}/sbom.xml

      .node_sbom:
        extends: .node_base
        stage: sbom
        script:
          - cd "$DIR"
          - npm ci
          - npm install -g @cyclonedx/cyclonedx-npm
          - cyclonedx-npm -o sbom.xml
        artifacts:
          when: always
          paths:
            - ${DIR}/sbom.xml

      .py_lint:
        extends: .py_base
        stage: lint
        script:
          - cd "$DIR"
          - poetry install --no-root
          - poetry run flake8 .
      
      .node_lint:
        extends: .node_base
        stage: lint
        script:
          - cd "$DIR"
          - npm ci
          - npm run lint --if-present

      # Skeletons for optional test / scan (customize if/when you add them)
      .py_test:
        extends: .py_base
        stage: test
        script:
          - cd "$DIR"
          - poetry install --no-root
          - poetry run pytest -q || true

      .node_test:
        extends: .node_base
        stage: test
        script:
          - cd "$DIR"
          - npm ci
          - npm test --if-present || true
      YAML

    # Discover directories & append jobs
    - |
      # List top-level directories only; adjust if you keep apps deeper
      for d in */ ; do
        [ -d "$d" ] || continue
        dir="${d%/}"
        added=0

        if [ -f "$dir/pyproject.toml" ]; then
          cat >> child-pipeline.yml <<YAML

      ${dir}_sbom_py:
        extends: .py_sbom
        variables: { DIR: "$dir" }
      ${dir}_lint_py:
        extends: .py_lint
        variables: { DIR: "$dir" }
      ${dir}_test_py:
        extends: .py_test
        variables: { DIR: "$dir" }
YAML
          added=1
        fi

        if [ -f "$dir/package.json" ]; then
          cat >> child-pipeline.yml <<YAML

      ${dir}_sbom_node:
        extends: .node_sbom
        variables: { DIR: "$dir" }
      ${dir}_lint_node:
        extends: .node_lint
        variables: { DIR: "$dir" }
      ${dir}_test_node:
        extends: .node_test
        variables: { DIR: "$dir" }
YAML
          added=1
        fi

        if [ "$added" -eq 1 ]; then
          echo "Added jobs for $dir"
        else
          echo "No known project markers in $dir (skipping)"
        fi
      done

    - echo "---- child-pipeline.yml ----"; cat child-pipeline.yml
  artifacts:
    paths:
      - child-pipeline.yml

# Actually run the generated child pipeline
run-child-pipeline:
  stage: prepare
  needs: [generate-child-pipeline]
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: generate-child-pipeline
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# --------------------------------------------------------------------
# 2) REPO-WIDE SCANS (optional): keep these root-level jobs if you like
# --------------------------------------------------------------------

# Dependency Scanning at repo root (GitLab official image)
dependency_scan:
  stage: scan
  image: registry.gitlab.com/gitlab-org/security-products/dependency-scanning:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "[dependency_scan] PWD: $PWD"
    - echo "[dependency_scan] Root contents:" && ls -al
    - dependency-scanning scan .

