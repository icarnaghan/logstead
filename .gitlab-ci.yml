# Monorepo-friendly CI with dynamic child pipeline generation.
# Stages: prepare -> sbom -> lint -> test -> scan

stages:
  - prepare
  - sbom
  - lint
  - test
  - scan

include:
  - template: Security/SAST.gitlab-ci.yml

default:
  interruptible: true
  before_script:
    - |
      echo "[ci] PWD: $PWD"
      echo "[ci] Root contents:"
      ls -al

# ---------------------------------------------------------------
# 1) Generate a child pipeline with jobs for each project folder
#    - Python projects: have pyproject.toml
#    - Node projects:   have package.json
# ---------------------------------------------------------------
generate-child-pipeline:
  stage: prepare
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - set -euo pipefail
    - apk add --no-cache bash
    - |
      echo "Generating child pipeline template..."
      cat > child-pipeline.yml <<'EOF'
      # Autogenerated by generate-child-pipeline
      stages: [sbom, lint, test, scan]

      # ---------- Base templates ----------
      .py_base:
        image: python:3.11
        variables:
          PIP_CACHE_DIR: .cache/pip
          POETRY_CACHE_DIR: .cache/pypoetry
        before_script:
          - python --version
          - pip install --upgrade pip
          - pip install poetry
          - echo "[py] poetry version:"
          - poetry --version
        cache:
          key: "$CI_PROJECT_PATH_SLUG-$CI_COMMIT_REF_SLUG-$DIR-py"
          paths:
            - .cache/pip
            - .cache/pypoetry
          policy: pull-push

      .node_base:
        image: node:20-alpine
        before_script:
          - node --version
          - npm --version
          - npm config set cache .npm --location=project
        cache:
          key: "$CI_PROJECT_PATH_SLUG-$CI_COMMIT_REF_SLUG-$DIR-node"
          paths:
            - .npm
            - .pnpm-store
            - .yarn/cache
          policy: pull-push

      # ---------- Python jobs ----------
      .py_sbom:
        extends: .py_base
        stage: sbom
        script:
          - cd "$DIR"
          - pip install --upgrade pip cyclonedx-bom
          - poetry install --no-root
          - cyclonedx-py poetry -o sbom.xml
        artifacts:
          when: always
          paths:
            - ${DIR}/sbom.xml

      .py_lint:
        extends: .py_base
        stage: lint
        script:
          - cd "$DIR"
          - poetry install --no-root
          - poetry run flake8 .

      .py_test:
        extends: .py_base
        stage: test
        script:
          - cd "$DIR"
          - poetry install --no-root
          - poetry run pytest -q

      # ---------- Node jobs ----------
      .node_sbom:
        extends: .node_base
        stage: sbom
        script:
          - cd "$DIR"
          - npm ci
          - npm install -g @cyclonedx/cyclonedx-npm
          - cyclonedx-npm -o sbom.xml
        artifacts:
          when: always
          paths:
            - ${DIR}/sbom.xml

      .node_lint:
        extends: .node_base
        stage: lint
        script:
          - cd "$DIR"
          - npm ci
          - npm run lint --if-present

      .node_test:
        extends: .node_base
        stage: test
        script:
          - cd "$DIR"
          - npm ci
          - npm test --if-present
      EOF
    - |
      echo "Discovering project directories..."
      # If your apps are deeper, swap the loop for e.g. 'for d in services/*/ ; do'
      for d in */ ; do
        [ -d "$d" ] || continue
        dir="${d%/}"
        added=0

        if [ -f "$dir/pyproject.toml" ]; then
          cat >> child-pipeline.yml <<'EOF'

      ${dir}_sbom_py:
        extends: .py_sbom
        variables: { DIR: "__DIR__" }

      ${dir}_lint_py:
        extends: .py_lint
        variables: { DIR: "__DIR__" }

      ${dir}_test_py:
        extends: .py_test
        variables: { DIR: "__DIR__" }
      EOF
          # Replace placeholder to avoid heredoc variable expansion issues
          sed -i "s#__DIR__#${dir}#g" child-pipeline.yml
          added=1
        fi

        if [ -f "$dir/package.json" ]; then
          cat >> child-pipeline.yml <<EOF

      ${dir}_sbom_node:
        extends: .node_sbom
        variables: { DIR: "$dir" }

      ${dir}_lint_node:
        extends: .node_lint
        variables: { DIR: "$dir" }

      ${dir}_test_node:
        extends: .node_test
        variables: { DIR: "$dir" }
      EOF
          added=1
        fi

        if [ "$added" -eq 1 ]; then
          echo "Added jobs for $dir"
        else
          echo "No project markers in $dir (skipping)"
        fi
      done
    - echo "----- child-pipeline.yml -----"
    - cat child-pipeline.yml
  artifacts:
    paths:
      - child-pipeline.yml

# Run the generated child pipeline and wait for it
run-child-pipeline:
  stage: prepare
  needs: [generate-child-pipeline]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: generate-child-pipeline
    strategy: depend
