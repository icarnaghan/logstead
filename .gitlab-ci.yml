
stages:
  - sbom
  - lint
  - test
  - scan

include:
  - template: Security/SAST.gitlab-ci.yml

sbom:
  image: python:3.11
  script:
    - pip install cyclonedx-bom
    - cd backend && cyclonedx-py -o sbom.xml && cd ..
    - apt-get update && apt-get install -y npm
    - npm install -g @cyclonedx/cyclonedx-npm
    - echo "Listing root directory contents for debug:" && ls -al
    - echo "Listing frontend directory contents for debug:" && ls -al frontend || echo "frontend directory missing"
    - cd frontend && cyclonedx-npm -o sbom.xml && cd ..
  artifacts:
    paths:
      - backend/sbom.xml
      - frontend/sbom.xml

lint_backend:
  image: python:3.11
  script:
    - pip install poetry
    - cd backend && poetry install
    - poetry run flake8 .

lint_frontend:
  image: node:20-alpine
  script:
    - cd frontend && npm ci
    - npm run lint

dependency_scan:
  image: registry.gitlab.com/gitlab-org/security-products/dependency-scanning:latest
  script:
    - dependency-scanning scan $CI_PROJECT_DIR

