stages:
  - sbom
  - lint
  - test
  - scan

sbom:
  image: python:3.11
  script:
    - pip install cyclonedx-bom cyclonedx-bom-npm
    - cd backend && cyclonedx-py -o sbom.xml && cd ..
    - cd frontend && cyclonedx-npm -o sbom.xml && cd ..
  artifacts:
    paths:
      - backend/sbom.xml
      - frontend/sbom.xml

lint_backend:
  image: python:3.11
  script:
    - pip install poetry
    - cd backend && poetry install
    - poetry run flake8 .

lint_frontend:
  image: node:20-alpine
  script:
    - cd frontend && npm ci
    - npm run lint

dependency_scan:
  image: registry.gitlab.com/gitlab-org/security-products/dependency-scanning:latest
  script:
    - dependency-scanning scan

sast:
  image: registry.gitlab.com/gitlab-org/security-products/sast:latest
  script:
    - /analyzer run
