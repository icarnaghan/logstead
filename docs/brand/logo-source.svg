<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160">
  <defs>
    <!-- House Outline Gradient (Amber to Deep Orange) -->
    <linearGradient id="house-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Bar 1 (Short - Warm Orange) -->
    <linearGradient id="bar1-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Bar 2 (Medium - Warm Amber / Gold) -->
    <linearGradient id="bar2-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Bar 3 (Tall - Emerald to Teal) -->
    <linearGradient id="bar3-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>

  <!-- Logo Mark: Geometric House with Ascending Ledger Bars -->
  <g transform="translate(15, 10)">
    <!-- Chimney -->
    <path d="M 46 54 L 46 36 L 58 36 L 58 44" fill="none" stroke="url(#house-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Symmetrical House Structure -->
    <path d="M 28 72 L 80 30 L 132 72 L 132 124 C 132 128 128 132 124 132 L 36 132 C 32 132 28 128 28 124 Z" fill="none" stroke="url(#house-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bar 1: Short -->
    <rect x="46" y="94" width="16" height="30" rx="4" fill="url(#bar1-grad)" />

    <!-- Bar 2: Medium -->
    <rect x="72" y="74" width="16" height="50" rx="4" fill="url(#bar2-grad)" />

    <!-- Bar 3: Tall -->
    <rect x="98" y="54" width="16" height="70" rx="4" fill="url(#bar3-grad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(180, 96)">
    <!-- Wordmark -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="currentColor">
      logstead
    </text>

    <!-- Tagline -->
    <text x="4" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#0F766E">
      SCHEDULE E SIMPLIFIED
    </text>
  </g>
</svg>