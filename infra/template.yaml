AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Logstead - serverless Schedule E rental tax app. Provisions the DynamoDB
  single table (GSI1/GSI2), the S3 file bucket, the SPA bucket + CloudFront
  distribution, the Cognito User Pool + Hosted UI, and the API Gateway HTTP API
  with a native Cognito JWT authorizer fronting a single Python 3.12 Lambda.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    why: >-
      Single-user Schedule E rental tax app. Stateful resources hold
      irreplaceable financial records, so the DynamoDB table and the S3 files
      bucket are retained on stack/resource delete.
    must:
      - The DynamoDB table name is hard-coded "Logstead" because
        backend/src/logstead/repository/keys.py and the seeded category catalog
        depend on that exact name; it must not be parameterised.
      - The RentCast API key is a secret and must never be stored in a plain
        template parameter or Lambda env var; it lives in an SSM SecureString
        parameter read at runtime.

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: >
      Custom domain for the SPA (CloudFront alias and Cognito callback host).
      Leave blank unless UseCustomDomain=true. Set your value in samconfig.toml
      (see samconfig.toml.example).
  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ARN of an ACM certificate in us-east-1 covering DomainName. Required for
      the CloudFront custom domain. Leave blank to deploy CloudFront on its
      default *.cloudfront.net domain (set UseCustomDomain=false).
  UseCustomDomain:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Attach DomainName + CertificateArn to CloudFront. Requires CertificateArn.
  IdentityProviders:
    Type: CommaDelimitedList
    Default: COGNITO
    Description: >
      Sign-in providers enabled on the SPA app client, e.g. "COGNITO" (user
      pool passwords), "IAMIdentityCenter" (a SAML provider), or both. Federated
      providers are created in the Cognito console, outside this stack, and must
      exist before deploying. The stack sets the full list on every client
      update, so this must match what you want enabled or a deploy will reset it.
  AllowedSpaOrigin:
    Type: String
    Default: ""
    AllowedPattern: "^(https://[A-Za-z0-9.-]+(:[0-9]+)?)?$"
    Description: >
      Browser origin allowed by the files bucket CORS when UseCustomDomain=false,
      e.g. https://d111111abcdef8.cloudfront.net (no trailing slash). Leave blank
      on the first deploy (CORS then allows only http://localhost:5173), then set
      it to the CloudFrontDomain stack output and redeploy. Ignored when
      UseCustomDomain=true (DomainName is used). It cannot be derived in the
      template because the CSP policy references this bucket and the
      distribution references the policy (circular dependency).
  CognitoDomainPrefix:
    Type: String
    Default: logstead-auth
    Description: Globally-unique prefix for the Cognito Hosted UI domain.
  RentCastApiKeyParam:
    Type: String
    Default: ""
    Description: >
      Name of an SSM Parameter Store SecureString holding the RentCast API key
      (e.g. /logstead/rentcast-api-key). The secret itself is never stored in
      this template or the Lambda env; the function reads it at runtime with
      decryption. Leave blank to run without enrichment (routes 503).
  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Email address for cost and usage alerts (AWS Budgets and the paid-route
      request-count alarms). Leave blank to create the alarms without
      notifications and skip the budget. The subscription must be confirmed
      from the email AWS sends.
  BudgetMonthlyUsd:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Monthly account cost budget in USD (alerts at 80% actual and 100% forecasted).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasCustomDomain: !Equals [!Ref UseCustomDomain, "true"]
  HasAllowedSpaOrigin: !Not [!Equals [!Ref AllowedSpaOrigin, ""]]
  HasRentCastParam: !Not [!Equals [!Ref RentCastApiKeyParam, ""]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Tracing: Active  # X-Ray active tracing (observability)

Resources:

  # --- DynamoDB single table -------------------------------------------------
  LogsteadTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Holds all durable app data (properties, transactions, assets, reports).
        must:
          - TableName is fixed "Logstead"; keys.py and seeded data depend on it.
          - Retained on delete so tax records are never lost with the stack.
    Properties:
      TableName: Logstead
      DeletionProtectionEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Sparse TTL: only items carrying a `ttl` attribute (the transient
      # Extraction_Job records) are reaped; every existing entity lacks `ttl`
      # and is unaffected.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- S3: file bucket (photos, receipts, uploaded PDFs, exports) ------------
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores property photos, receipts, uploaded PDFs, and exports.
        must:
          - Retained on delete so uploaded tax documents are never lost.
    Properties:
      BucketName: !Sub "logstead-files-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # No wildcard origin. Without a custom domain, only the explicit
          # AllowedSpaOrigin (CloudFront domain, set on the second deploy) or
          # the Vite dev origin is allowed. The frontend only PUTs to presigned
          # URLs with Content-Type; other methods/headers are not needed.
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins:
              - !If
                - HasCustomDomain
                - !Sub "https://${DomainName}"
                - !If [HasAllowedSpaOrigin, !Ref AllowedSpaOrigin, "http://localhost:5173"]
            AllowedHeaders: [Content-Type]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireExports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 30
          # Defense-in-depth backstop for abandoned Schedule E extraction
          # uploads. The ExtractionService explicitly deletes the PDF on a
          # terminal state; this rule guarantees nothing lingers (shortest
          # whole-day S3 lifecycle TTL).
          - Id: ExpireScheduleEImports
            Status: Enabled
            Prefix: imports/schedule-e/
            ExpirationInDays: 1
          # Accountant packages and generated PDFs are short-lived downloads
          # (links last 15 minutes). The bucket is versioned, so expiring the
          # current version leaves the bytes as a noncurrent version; the
          # NoncurrentVersionExpiration makes the data actually go. These
          # prefixes also match the 30-day ExpireExports rule; the shorter
          # expiry governs. The existing rules above are intentionally left
          # as they are (see docs/future-improvements.md).
          - Id: ExpireAccountantPackages
            Status: Enabled
            Prefix: exports/packages/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: ExpireGeneratedPdfs
            Status: Enabled
            Prefix: exports/pdf/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub "${FilesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --- S3: SPA static asset bucket -------------------------------------------
  SpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "logstead-spa-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SpaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SpaDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SpaBucket.Arn
              - !Sub "${SpaBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --- CloudFront in front of the SPA bucket ---------------------------------
  SpaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "logstead-spa-oac-${AWS::Region}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Security headers for the SPA (review finding S1). CSP notes:
  #  - script-src 'self': the theme bootstrap is a static file (theme-init.js).
  #  - style-src keeps 'unsafe-inline': Radix Dialog (react-remove-scroll) injects
  #    <style> elements at runtime, which style-src 'self' alone would block.
  #    Tailwind itself ships as a static CSS file and does not need it.
  #  - connect-src: API (wildcard on execute-api to avoid a template dependency
  #    cycle HttpApi -> UserPoolClient -> SpaDistribution), the Cognito token
  #    endpoint, and the files bucket (presigned PUT uploads).
  #  - img-src: presigned S3 GET URLs for photos, plus data: URIs.
  SpaResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "logstead-spa-security-headers-${AWS::Region}"
        Comment: Security headers for the Logstead SPA.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data: https://${FilesBucket}.s3.${AWS::Region}.amazonaws.com https://${FilesBucket}.s3.amazonaws.com;
              font-src 'self';
              connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com https://${FilesBucket}.s3.${AWS::Region}.amazonaws.com https://${FilesBucket}.s3.amazonaws.com;
              object-src 'none';
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self'
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
              Override: true

  SpaDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      # CertificateArn is only referenced when UseCustomDomain=true, when the
      # user supplies a real ACM ARN. The linter cannot see the condition, so
      # it flags the empty default; suppress that specific rule here.
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: SpaS3Origin
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref SpaOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: SpaS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          ResponseHeadersPolicyId: !Ref SpaResponseHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # --- Cognito User Pool + Hosted UI -----------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: logstead-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true  # single-user app; no public sign-up
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: logstead-spa
      GenerateSecret: false  # public SPA client (Authorization Code + PKCE)
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: !Ref IdentityProviders
      # Always register the CloudFront origin (the SPA host when there is no
      # custom domain) and localhost for dev. When a custom domain is enabled,
      # register it too. Cognito rejects any redirect_uri not in these lists.
      CallbackURLs:
        - !Sub "https://${SpaDistribution.DomainName}/auth/callback"
        - "http://localhost:5173/auth/callback"
        - !If [HasCustomDomain, !Sub "https://${DomainName}/auth/callback", !Ref "AWS::NoValue"]
      LogoutURLs:
        - !Sub "https://${SpaDistribution.DomainName}/"
        - "http://localhost:5173/"
        - !If [HasCustomDomain, !Sub "https://${DomainName}/", !Ref "AWS::NoValue"]

  # --- API Gateway HTTP API with native Cognito JWT authorizer ---------------
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /logstead/http-api/access
      RetentionInDays: 90

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      # Throttling (review S4). Stage default applies to every route; the paid
      # third-party routes get much lower limits. Per-route settings only take
      # effect for routes that exist explicitly (see the Throttled* events on
      # ApiFunction), not for the ANY /{proxy+} catch-all.
      # DetailedMetricsEnabled publishes per-route Count metrics (dimensions
      # ApiId, Stage, Route) used by the paid-route usage alarms below.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
        DetailedMetricsEnabled: true
      RouteSettings:
        # Static reference data (authenticated, cached by the browser).
        "GET /categories":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
          DetailedMetricsEnabled: true
        # Amazon Location autocomplete / secondary (unit) addresses.
        "GET /addresses":
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
          DetailedMetricsEnabled: true
        "GET /addresses/units":
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
          DetailedMetricsEnabled: true
        # RentCast enrichment.
        "POST /properties/enrich":
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 2
          DetailedMetricsEnabled: true
        # Schedule E PDF extraction (Textract).
        "POST /imports/schedule-e/extractions":
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 2
          DetailedMetricsEnabled: true
        "POST /imports/schedule-e/extractions/{jobId}/start":
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 2
          DetailedMetricsEnabled: true
        # Accountant package creation (starts the worker Lambda) and the two
        # synchronous PDF report routes (each writes an object to S3).
        "POST /accountant-packages":
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 2
          DetailedMetricsEnabled: true
        "POST /properties/{propertyId}/report/pdf":
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
          DetailedMetricsEnabled: true
        "POST /reports/combined/pdf":
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
          DetailedMetricsEnabled: true
        # Global search (reads the user's records through the existing services).
        "GET /search":
          ThrottlingRateLimit: 2
          ThrottlingBurstLimit: 5
          DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      CorsConfiguration:
        AllowOrigins:
          - !If [HasCustomDomain, !Sub "https://${DomainName}", "http://localhost:5173"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoJwt

  # --- API Lambda (single monolithic function) -------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # The backend uses a src/ layout (pyproject: packages.find where=["src"]),
      # so the default Python builder would leave the package under src/ and the
      # handler import would fail. A makefile build pip-installs the package so
      # logstead/ lands at the artifact root alongside its dependencies.
      BuildMethod: makefile
    Properties:
      FunctionName: logstead-api
      CodeUri: ../backend/
      Handler: logstead.router.handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref LogsteadTable
          FILES_BUCKET: !Ref FilesBucket
          # Only the SSM parameter NAME is passed; the Lambda reads the secret
          # value at runtime with decryption (never plaintext in the env).
          RENTCAST_API_KEY_PARAM: !Ref RentCastApiKeyParam
          # Name of the worker that builds accountant packages. The API starts
          # it with an asynchronous invoke; unset locally, the create route 503s.
          PACKAGE_WORKER_FUNCTION: !Ref PackageWorkerFunction
      # Reserved concurrency caps cost/availability abuse (review S4/S5,
      # docs/decisions/waf.md). The app is single-user, so 10 is ample.
      ReservedConcurrentExecutions: 10
      Policies:
        # DynamoDBCrudPolicy grants BatchGetItem, BatchWriteItem, PutItem,
        # DeleteItem, GetItem, Scan, Query, UpdateItem, ConditionCheckItem,
        # DescribeTable on the table and its indexes. The backend uses only
        # GetItem, PutItem, DeleteItem, Query and TransactWriteItems (which is
        # authorized by the underlying PutItem/DeleteItem). The extra actions
        # (Scan, Batch*, UpdateItem) are unused, but the policy is scoped to this
        # one table and its indexes, so it is kept for simplicity.
        - DynamoDBCrudPolicy:
            TableName: !Ref LogsteadTable
        # Explicit S3 grants (replaces S3CrudPolicy, which allows s3:* style
        # CRUD on the whole bucket). Actions are limited to what the backend
        # calls: put_object (exports), delete_object, get_object (Range read and
        # page count of the Schedule E PDF), and presigned PUT/GET URLs, which
        # are signed by this role and need the matching s3:PutObject /
        # s3:GetObject. Textract async reads the PDF from S3 using the caller's
        # (this role's) credentials, so it needs s3:GetObject on imports/.
        # No ListBucket: S3 errors on reads are already handled as "absent".
        - Statement:
            - Sid: FilesBucketReadWrite
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub "${FilesBucket.Arn}/photos/*"
                - !Sub "${FilesBucket.Arn}/receipts/*"
                - !Sub "${FilesBucket.Arn}/business-docs/*"
                - !Sub "${FilesBucket.Arn}/imports/*"
                - !Sub "${FilesBucket.Arn}/exports/*"
            - Sid: FilesBucketDelete
              Effect: Allow
              Action: s3:DeleteObject
              Resource:
                # exports/ expire via lifecycle and are not deleted by the app,
                # except the two prefixes below: a user can delete a finished
                # accountant package, and the generated PDFs sit beside it.
                - !Sub "${FilesBucket.Arn}/photos/*"
                - !Sub "${FilesBucket.Arn}/receipts/*"
                - !Sub "${FilesBucket.Arn}/business-docs/*"
                - !Sub "${FilesBucket.Arn}/imports/*"
                - !Sub "${FilesBucket.Arn}/exports/packages/*"
                - !Sub "${FilesBucket.Arn}/exports/pdf/*"
        # Start the package worker (asynchronous invoke) and nothing else.
        - Statement:
            - Sid: InvokePackageWorker
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt PackageWorkerFunction.Arn
        # Address autocomplete uses Amazon Location Service (geo-places), called
        # with the Lambda's IAM role (SigV4) - no API key. Per the Service
        # Authorization Reference, geo-places:Autocomplete and Geocode support the
        # "provider" resource type (arn:${Partition}:geo-places:${Region}::provider/default)
        # and have no condition keys, so the grant is scoped to that ARN.
        # https://docs.aws.amazon.com/service-authorization/latest/reference/list_geo-places.html
        - Statement:
            - Effect: Allow
              Action:
                - geo-places:Autocomplete
                - geo-places:Geocode
              Resource: !Sub "arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default"
        # Read the RentCast API key from its SSM SecureString parameter (only
        # granted when a parameter name is configured). SSM decrypts with the
        # account's default SSM KMS key, so no explicit kms:Decrypt is needed.
        - !If
          - HasRentCastParam
          - Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${RentCastApiKeyParam}"
          - !Ref "AWS::NoValue"
        # Schedule E PDF extraction uses Amazon Textract async document analysis
        # (StartDocumentAnalysis / GetDocumentAnalysis). Textract async analysis
        # supports no resource-level permissions for these actions: the Service
        # Authorization Reference lists only "adapter" and "adapterversion"
        # resource types (for adapter actions) and neither action has condition
        # keys, so "*" is the narrowest valid Resource.
        # https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazontextract.html
        # (machine-readable: https://servicereference.us-east-1.amazonaws.com/v1/textract/textract.json)
        # Abuse is bounded instead by API throttling and reserved concurrency. The chosen
        # v1 flow is the polling path: no SNS topic and no Textract service role.
        - Statement:
            - Effect: Allow
              Action:
                - textract:StartDocumentAnalysis
                - textract:GetDocumentAnalysis
              Resource: "*"
      Events:
        # Reference data. Requires sign-in (default JWT authorizer); the app
        # only calls it after login. Explicit route so it can be throttled.
        Categories:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /categories
        # All other routes fall through to this catch-all under the default
        # Cognito JWT authorizer. The in-Lambda router matches the exact path.
        ProxyAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /{proxy+}
        # Explicit routes for the throttled paid-third-party paths. They exist
        # only so RouteSettings can target them; the JWT authorizer still
        # applies (default) and the same Lambda serves them.
        ThrottledAddressSuggest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /addresses
        ThrottledAddressUnits:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /addresses/units
        ThrottledPropertyEnrich:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /properties/enrich
        ThrottledExtractionCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /imports/schedule-e/extractions
        ThrottledExtractionStart:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /imports/schedule-e/extractions/{jobId}/start
        ThrottledPackageCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /accountant-packages
        ThrottledPropertyReportPdf:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /properties/{propertyId}/report/pdf
        ThrottledCombinedReportPdf:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /reports/combined/pdf
        ThrottledSearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /search
        # CORS preflight: browsers send OPTIONS with no Authorization header, so
        # it must NOT be behind the JWT authorizer. Without this explicit route,
        # the ANY /{proxy+} route above catches OPTIONS and the authorizer 401s
        # the preflight, which the browser reports as a CORS failure. API Gateway
        # auto-CORS answers this route from the CorsConfiguration.
        CorsPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: OPTIONS
            Path: /{proxy+}
            Auth:
              Authorizer: NONE

  # --- Package worker Lambda (accountant package builder) --------------------
  # Same source as ApiFunction, different handler. It is started only by the
  # API through an asynchronous invoke and builds one ZIP per job.
  PackageWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      com.aws.cloudformation.Context:
        why: >-
          Builds the accountant package ZIP outside the 30 second API
          integration limit and the 6 MB response limit.
        must:
          - Reserved concurrency stays at 2; it counts against the account's
            unreserved Lambda pool (see docs/deployment.md).
          - Zero retries; a failed build marks the job failed and the user
            starts a new one, so a retry would only repeat the same failure.
          - Grants stay limited to the table, receipts/* reads and
            exports/packages/* writes.
    Properties:
      FunctionName: logstead-package-worker
      CodeUri: ../backend/
      Handler: logstead.worker.package_worker.handler
      Timeout: 600
      MemorySize: 1024
      EphemeralStorage:
        Size: 1024
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          TABLE_NAME: !Ref LogsteadTable
          FILES_BUCKET: !Ref FilesBucket
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 300
      Policies:
        # Reads properties, transactions, documents and the job, and writes the
        # job. No delete, update, scan, or batch actions are needed.
        - Statement:
            - Sid: TableReadJobWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
              Resource:
                - !GetAtt LogsteadTable.Arn
                - !Sub "${LogsteadTable.Arn}/index/*"
            # Receipts are read by key. No ListBucket: an absent receipt is a
            # skipped entry, not an error.
            - Sid: ReadReceipts
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${FilesBucket.Arn}/receipts/*"
            - Sid: WritePackage
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:AbortMultipartUpload
              Resource: !Sub "${FilesBucket.Arn}/exports/packages/*"

  # --- Observability alarms --------------------------------------------------
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-api-lambda-errors
      AlarmDescription: The API Lambda reported function errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  PackageWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-package-worker-errors
      AlarmDescription: The accountant package worker reported function errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PackageWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-api-lambda-throttles
      AlarmDescription: The API Lambda is being throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-http-api-5xx
      AlarmDescription: The HTTP API returned 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # HTTP API metrics cannot be split by status code beyond 4xx/5xx, so this
  # fires on any 4xx spike (including 429 throttling and auth failures).
  Api4xxSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-http-api-4xx-spike
      AlarmDescription: >-
        Spike of 4xx responses from the HTTP API (may indicate 429 throttling
        or abuse). Check the access log for status 429.
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # --- Cost and usage alarms for paid third-party routes (review S4) ---------
  # Notifications are sent only when AlertEmail is set. Thresholds are request
  # counts per 5 minutes, well above normal single-user use. RentCast is
  # external, so the enrich-route count is the usage proxy; the monthly budget
  # covers actual AWS spend (Location, Textract).
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      TopicName: logstead-alerts
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: logstead-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetMonthlyUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  PaidRouteAddressSuggestUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-paid-route-addresssuggest-usage
      AlarmDescription: >-
        High request volume on GET /addresses (Amazon Location autocomplete). Possible abuse or a
        runaway client; check the access log.
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: prod
        - Name: Route
          Value: "GET /addresses"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref "AWS::NoValue"]

  PaidRouteAddressUnitsUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-paid-route-addressunits-usage
      AlarmDescription: >-
        High request volume on GET /addresses/units (Amazon Location secondary-address lookups). Possible abuse or a
        runaway client; check the access log.
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: prod
        - Name: Route
          Value: "GET /addresses/units"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref "AWS::NoValue"]

  PaidRouteEnrichUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-paid-route-enrich-usage
      AlarmDescription: >-
        High request volume on POST /properties/enrich (RentCast enrichment, a proxy for third-party API usage). Possible abuse or a
        runaway client; check the access log.
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: prod
        - Name: Route
          Value: "POST /properties/enrich"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref "AWS::NoValue"]

  PaidRouteExtractionCreateUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-paid-route-extractioncreate-usage
      AlarmDescription: >-
        High request volume on POST /imports/schedule-e/extractions (Textract extraction job creation). Possible abuse or a
        runaway client; check the access log.
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: prod
        - Name: Route
          Value: "POST /imports/schedule-e/extractions"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref "AWS::NoValue"]

  PaidRouteExtractionStartUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: logstead-paid-route-extractionstart-usage
      AlarmDescription: >-
        High request volume on POST /imports/schedule-e/extractions/{jobId}/start (Textract extraction start). Possible abuse or a
        runaway client; check the access log.
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: prod
        - Name: Route
          Value: "POST /imports/schedule-e/extractions/{jobId}/start"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref "AWS::NoValue"]

Outputs:
  ApiBaseUrl:
    Description: Base URL for VITE_API_BASE_URL.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  CloudFrontDomain:
    Description: CloudFront distribution domain (SPA host if no custom domain).
    Value: !GetAtt SpaDistribution.DomainName
  SpaBucketName:
    Description: Upload the built SPA (frontend/dist) here.
    Value: !Ref SpaBucket
  FilesBucketName:
    Value: !Ref FilesBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: VITE_COGNITO_CLIENT_ID.
    Value: !Ref UserPoolClient
  CognitoHostedUiDomain:
    Description: VITE_COGNITO_DOMAIN (Hosted UI base).
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
